<!DOCTYPE html>
<html>
<head>
  <title>AI Money Mentor</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #f5f5f5;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 200px;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>

<body>

<h2>💰 AI Money Mentor</h2>

<input type="number" id="income" placeholder="Enter Monthly Income"><br>
<input type="number" id="expenses" placeholder="Enter Monthly Expenses"><br>

<button onclick="calculate()">Get AI Advice</button>

<div id="result"></div>

<script>
function calculate() {
  let income = document.getElementById("income").value;
  let expenses = document.getElementById("expenses").value;

  income = parseFloat(income);
  expenses = parseFloat(expenses);

  if (!income || !expenses) {
    document.getElementById("result").innerHTML = "Please enter valid values!";
    return;
  }

  let savings = income - expenses;
  let advice = "";

  if (savings > 0) {
    advice = "✅ Great! You are saving ₹" + savings + ". Invest in SIP or mutual funds.";
  } else if (savings === 0) {
    advice = "⚠️ You are breaking even. Try to reduce expenses.";
  } else {
    advice = "❌ You are overspending by ₹" + Math.abs(savings) + ". Cut unnecessary expenses!";
  }

  document.getElementById("result").innerHTML = advice;
}
</script>

</body>
</html>
